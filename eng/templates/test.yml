parameters:
- name: testAssembly
  type: string
  default: ''
- name: artifactName
  type: string
  default: ''

steps:
  - task: DownloadPipelineArtifact@2
    displayName: 'Download Tests Artifact'
    inputs:
      artifactName: '${{ parameters.artifactName }}'
      targetPath: '$(System.DefaultWorkingDirectory)/tests'

  - bash: |
      echo "Listing downloaded test DLLs:"
      find "$(System.DefaultWorkingDirectory)/tests" -name '*Test*.dll'
    displayName: 'List Test DLLs'

  - task: npmAuthenticate@0
    displayName: 'Authenticate npm'
    inputs:
      workingFile: '$(Build.SourcesDirectory)/eng/templates/.npmrc'

  # Install Azurite
  - bash: |
      echo "Installing azurite"
      npm install -g azurite
      mkdir azurite1
      echo "azurite installed"
      azurite --silent --location azurite1 --debug azurite1\debug.txt --queuePort 10001 --skipApiVersionCheck &
      echo "azurite started"
      sleep 5
    displayName: 'Install and Run Azurite'
    env:
      NPM_CONFIG_USERCONFIG: '$(Build.SourcesDirectory)/eng/templates/.npmrc'

  # Run tests
  - task: VSTest@2
    displayName: 'Run tests'
    inputs:
      testAssemblyVer2: |
        $(System.DefaultWorkingDirectory)/${{ parameters.testAssembly }}
      testFiltercriteria: 'TestCategory!=DisabledInCI'
      vsTestVersion: '17.0'
      distributionBatchType: basedOnExecutionTime
      platform: 'any cpu'
      configuration: 'Debug'
      diagnosticsEnabled: True
      collectDumpOn: always
      rerunFailedTests: true
      rerunFailedThreshold: 30
      rerunMaxAttempts: 3
      runInParallel: true