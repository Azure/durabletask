# This pipeline is used for public PR and CI builds.

parameters:
- name: durableTaskClientVersion
  displayName: 'SDK Client version containing the large payload purge models (release prerequisite)'
  type: string
  default: ''

# Run on changes in main
trigger:
  batch: true
  branches:
    include:
    - main

# Run nightly to catch new CVEs and to report SDL often.
schedules:
  - cron: "0 5 * * *"
    displayName: Nightly Run
    branches:
      include:
      - main
    always: true # Run pipeline irrespective of no code changes since last successful run

# Run on all PRs
pr:
  branches:
    include:
    - '*'

# This allows us to reference 1ES templates, our pipelines extend a pre-existing template
resources:
  repositories:
  - repository: 1es
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  # The template we extend injects compliance-checks into the pipeline, such as SDL and CodeQL
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc-public
      image: 1es-windows-2022
      os: windows
      ${{ if eq( variables['Build.Reason'], 'Schedule' ) }}:
        demands:
        - Priority -equals Low

    sdl:
      codeql:
        compiled:
          enabled: true
        runSourceLanguagesInSourceAnalysis: true

    settings:
      # PR's from forks should not have permissions to set tags.
      skipBuildTagsForGitHubPullRequests: ${{ variables['System.PullRequest.IsFork'] }}

    stages:
    - stage: DTFxCoreValidate
      jobs:
      - job: Validate
        strategy:
          parallel: 13
        steps:
        # Build the code and the tests
        - template: /eng/templates/build-steps.yml@self
          parameters:
            # The tests only build in the 'Debug' configuration.
            # In the release configuration, the packages don't expose their internals
            # to the test projects.
            buildConfiguration: 'Debug'
            buildTests: true
            durableTaskClientVersion: ${{ parameters.durableTaskClientVersion }}
        # Run tests
        - template: /eng/templates/test.yml@self
          parameters:
            testAssembly: 'tests/**/DurableTask.Core.Tests.dll'
            artifactName: 'CoreTests'
    - stage: DTFxASValidate
      dependsOn: []
      jobs:
      - job: Validate
        strategy:
          parallel: 13
        steps:
        # Build the code and the tests
        - template: /eng/templates/build-steps.yml@self
          parameters:
            # The tests only build in the 'Debug' configuration.
            # In the release configuration, the packages don't expose their internals
            # to the test projects.
            buildConfiguration: 'Debug'
            buildTests: true
            durableTaskClientVersion: ${{ parameters.durableTaskClientVersion }}
        # Run tests
        - template: /eng/templates/test.yml@self
          parameters:
            testAssembly: 'tests/**/DurableTask.AzureStorage.Tests.dll'
            artifactName: 'AzureStorageTests'
    - stage: DTFxEmulatorValidate
      dependsOn: []
      jobs:
      - job: Validate
        strategy:
          parallel: 13
        steps:
        # Build the code and the tests
        - template: /eng/templates/build-steps.yml@self
          parameters:
            # The tests only build in the 'Debug' configuration.
            # In the release configuration, the packages don't expose their internals
            # to the test projects.
            buildConfiguration: 'Debug'
            buildTests: true
            durableTaskClientVersion: ${{ parameters.durableTaskClientVersion }}
        # Run tests
        - template: /eng/templates/test.yml@self
          parameters:
            testAssembly: 'tests/**/DurableTask.Emulator.Tests.dll'
            artifactName: 'EmulatorTests'

    - stage: DTFxLargePayloadPurgeValidate
      dependsOn: []
      jobs:
      - job: Validate
        steps:
        - task: UseDotNet@2
          displayName: 'Use the .NET 8 SDK'
          inputs:
            packageType: sdk
            version: '8.0.x'
        - task: DotNetCoreCLI@2
          displayName: 'Restore large payload purge contract tests'
          inputs:
            command: restore
            feedsToUse: config
            nugetConfigPath: 'NuGet.config'
            verbosityRestore: Minimal
            projects: 'Test/DurableTask.LargePayloadPurge.Abstractions.Tests/DurableTask.LargePayloadPurge.Abstractions.Tests.csproj'
            restoreArguments: '-p:DurableTaskClientVersion=${{ parameters.durableTaskClientVersion }}'
        - task: DotNetCoreCLI@2
          displayName: 'Test large payload purge contracts (net8.0 and net48)'
          inputs:
            command: test
            projects: 'Test/DurableTask.LargePayloadPurge.Abstractions.Tests/DurableTask.LargePayloadPurge.Abstractions.Tests.csproj'
            arguments: '--no-restore --configuration Debug -p:DurableTaskClientVersion=${{ parameters.durableTaskClientVersion }}'
